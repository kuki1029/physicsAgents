services:
  backend:
    container_name: physagent-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - physagent-network

  database:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: dev_atlas
    ports:
      - 5432:5432
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASS}
    volumes:
      - data:/data/database
      - config:/data/configdb  # For clusters, shared config
    networks:
      - physagent-network

  frontend:
    container_name: physagent-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - physagent-network
  
volumes:
  data:
  config:
  
networks:
  physagent-network:
    name: physagent-network